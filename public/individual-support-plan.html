<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個別支援計画管理</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hiragino Sans', 'Meiryo', sans-serif; font-size: 15px; background: #f5f5f0; color: #2c2c2a; }
.app { display: flex; height: 100vh; }

/* サイドバー */
.sidebar { width: 220px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 16px; border-bottom: 1px solid #eee; }
.sidebar-header h1 { font-size: 14px; font-weight: 600; color: #444; }
.sidebar-header p { font-size: 11px; color: #888; margin-top: 2px; }
.sidebar-menu { flex: 1; overflow-y: auto; padding: 8px 0; }
.menu-section { padding: 8px 16px 4px; font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
.menu-item { display: flex; align-items: center; gap: 8px; padding: 8px 16px; cursor: pointer; font-size: 13px; color: #555; transition: background 0.1s; border: none; background: none; width: 100%; text-align: left; }
.menu-item:hover { background: #f5f5f0; }
.menu-item.active { background: #e8f0fe; color: #1a56db; font-weight: 500; }
.menu-item .badge { margin-left: auto; background: #e8f0fe; color: #1a56db; border-radius: 10px; padding: 1px 7px; font-size: 11px; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid #eee; }

/* メインコンテンツ */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #fff; border-bottom: 1px solid #eee; }
.topbar h2 { font-size: 16px; font-weight: 600; }
.topbar-actions { display: flex; gap: 8px; }
.btn { padding: 7px 16px; border-radius: 6px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 13px; color: #444; transition: background 0.1s; }
.btn:hover { background: #f5f5f0; }
.btn.primary { background: #1a56db; color: #fff; border-color: #1a56db; }
.btn.primary:hover { background: #1648c0; }
.btn.danger { background: #fff; color: #c0392b; border-color: #f5c6cb; }
.btn.danger:hover { background: #fff5f5; }

.content { flex: 1; overflow-y: auto; padding: 24px; }

/* カード */
.card { background: #fff; border-radius: 10px; border: 1px solid #e8e8e8; margin-bottom: 16px; }
.card-header { padding: 14px 18px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
.card-header h3 { font-size: 14px; font-weight: 600; }
.card-body { padding: 18px; }

/* フォーム */
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
.form-row.single { grid-template-columns: 1fr; }
.form-row.triple { grid-template-columns: 1fr 1fr 1fr; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; color: #333; background: #fff;
}
.form-group textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #1a56db; box-shadow: 0 0 0 2px rgba(26,86,219,0.1); }

/* 利用者一覧 */
.user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.user-card { background: #fff; border-radius: 8px; border: 1px solid #e8e8e8; padding: 14px; cursor: pointer; transition: border-color 0.1s, box-shadow 0.1s; }
.user-card:hover { border-color: #1a56db; box-shadow: 0 2px 8px rgba(26,86,219,0.1); }
.user-card.selected { border-color: #1a56db; background: #f0f4ff; }
.user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #e8f0fe; color: #1a56db; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; margin-bottom: 8px; }
.user-name { font-size: 14px; font-weight: 600; }
.user-meta { font-size: 11px; color: #888; margin-top: 2px; }

/* 日誌一覧 */
.diary-list { display: flex; flex-direction: column; gap: 8px; }
.diary-item { background: #fff; border-radius: 8px; border: 1px solid #e8e8e8; padding: 14px; cursor: pointer; }
.diary-item:hover { border-color: #bbb; }
.diary-date { font-size: 12px; font-weight: 600; color: #1a56db; margin-bottom: 4px; }
.diary-summary { font-size: 13px; color: #444; }
.diary-tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #f0f4ff; color: #1a56db; }
.tag.green { background: #f0fdf4; color: #166534; }
.tag.amber { background: #fffbeb; color: #92400e; }
.tag.red { background: #fff5f5; color: #991b1b; }

/* 評価バッジ */
.rating { display: inline-flex; gap: 3px; }
.rating-dot { width: 10px; height: 10px; border-radius: 50%; background: #e0e0e0; }
.rating-dot.filled { background: #1a56db; }
.rating-dot.filled.green { background: #16a34a; }
.rating-dot.filled.amber { background: #d97706; }

/* 目標一覧 */
.goal-item { background: #fff; border-radius: 8px; border: 1px solid #e8e8e8; padding: 14px; margin-bottom: 10px; }
.goal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.goal-title { font-size: 13px; font-weight: 600; }
.goal-detail { font-size: 12px; color: #666; margin-top: 4px; line-height: 1.5; }
.goal-period { font-size: 11px; color: #888; margin-top: 6px; }
.progress-bar-bg { background: #eee; border-radius: 4px; height: 6px; margin-top: 8px; }
.progress-bar { background: #1a56db; border-radius: 4px; height: 6px; transition: width 0.3s; }

/* 短期目標の具体的項目（①②③…）を分けて表示 */
.support-items { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.support-item { display: flex; align-items: flex-start; gap: 8px; background: #f8f8f5; border-radius: 8px; padding: 8px 10px; }
.support-item-num { flex-shrink: 0; font-weight: 700; color: #1a56db; font-size: 13px; line-height: 1.5; }
.support-item-body { font-size: 12px; color: #555; line-height: 1.6; white-space: pre-wrap; }
.support-plain { font-size: 12px; color: #666; line-height: 1.6; white-space: pre-wrap; margin-top: 4px; }

/* 振り返り評価：短期目標の項目ごとの入力・表示 */
.review-item-edit { border: 1px solid #e8e8e8; border-radius: 8px; padding: 12px; margin-bottom: 10px; background: #fafaf7; }
.review-item-edit-head { font-size: 12px; font-weight: 600; color: #444; margin-bottom: 8px; line-height: 1.5; }
.review-item-edit .form-group { margin-bottom: 8px; }
.review-item-edit .form-group:last-child { margin-bottom: 0; }
.review-item-edit label { font-size: 11px; }
.review-item-edit textarea { min-height: 50px; font-size: 12px; }
.review-item-card { border: 1px solid #eee; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
.review-item-card:last-child { margin-bottom: 0; }
.review-item-head { font-size: 13px; font-weight: 700; color: #2c2c2a; margin-bottom: 8px; line-height: 1.5; }
.review-item-row { display: grid; grid-template-columns: 108px 1fr; gap: 10px; font-size: 12px; line-height: 1.6; margin-top: 6px; }
.review-item-row:first-of-type { margin-top: 0; }
.review-item-label { flex-shrink: 0; font-weight: 600; color: #888; }
.review-item-value { color: #444; white-space: pre-wrap; }

/* モーダル */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 680px; max-width: 95vw; max-height: 90vh; overflow-y: auto; padding: 24px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #eee; }

/* 振り返りセクション */
.review-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.review-stat { background: #f8f8f5; border-radius: 8px; padding: 14px; text-align: center; }
.review-stat .num { font-size: 28px; font-weight: 700; color: #1a56db; }
.review-stat .label { font-size: 11px; color: #888; margin-top: 2px; }

/* 空状態 */
.empty-state { text-align: center; padding: 60px 20px; color: #999; }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* 検索バー */
.search-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.search-bar input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
.search-bar input:focus { outline: none; border-color: #1a56db; }

/* 評価フォーム */
.rating-selector { display: flex; gap: 8px; }
.rating-btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 12px; color: #555; }
.rating-btn:hover { background: #f0f0f0; }
.rating-btn.active-good { background: #f0fdf4; border-color: #16a34a; color: #166534; }
.rating-btn.active-mid { background: #fffbeb; border-color: #d97706; color: #92400e; }
.rating-btn.active-bad { background: #fff5f5; border-color: #dc2626; color: #991b1b; }

/* タブ */
.tabs { display: flex; gap: 0; border-bottom: 1px solid #eee; margin-bottom: 20px; }
.tab { padding: 10px 20px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; color: #666; }
.tab:hover { color: #333; }
.tab.active { color: #1a56db; border-bottom-color: #1a56db; font-weight: 500; }

/* ナビゲーションブレッドクラム */
.breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; margin-bottom: 16px; }
.breadcrumb a { color: #1a56db; cursor: pointer; text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }

/* 日付バッジ */
.date-badge { display: inline-block; background: #f0f4ff; color: #1a56db; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }

/* スクロールバー */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

/* ピックアップボタン */
.pickup-btn { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 11px; color: #888; }
.pickup-btn:hover { border-color: #f59e0b; color: #d97706; background: #fffbeb; }
.pickup-btn.on { border-color: #f59e0b; background: #fffbeb; color: #92400e; font-weight: 600; }

/* ピックアップ一覧テーブル */
.pickup-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.pickup-table th { background: #f8f8f5; font-weight: 600; color: #555; padding: 10px 14px; text-align: left; border-bottom: 2px solid #e0e0e0; }
.pickup-table td { padding: 10px 14px; border-bottom: 1px solid #eee; vertical-align: top; line-height: 1.6; }
.pickup-table tr:hover td { background: #fffbeb; }
.pickup-category { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #fffbeb; color: #92400e; border: 1px solid #fcd34d; }

/* 音声入力ボタン */
.has-voice { display: flex; flex-wrap: wrap; gap: 6px; }
.has-voice label { width: 100%; margin-bottom: 0; }
.has-voice textarea { flex: 1; min-width: 0; }
.voice-btn {
  flex-shrink: 0; align-self: flex-start;
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid #ddd; background: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: background 0.15s, border-color 0.15s;
}
.voice-btn:hover { background: #f0f4ff; border-color: #1a56db; }
.voice-btn.recording { background: #fee2e2; border-color: #dc2626; animation: pulse 0.8s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,0.4)} 50%{box-shadow:0 0 0 6px rgba(220,38,38,0)} }

/* 印刷 */
@media print {
  .sidebar, .topbar-actions, .btn, .modal-overlay { display: none !important; }
  .main { overflow: visible; }
  .content { overflow: visible; }
  .pickup-btn { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <!-- サイドバー -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>個別支援管理</h1>
      <p>支援計画・日誌・評価</p>
    </div>
    <div class="sidebar-menu">
      <div class="menu-section">メニュー</div>
      <button class="menu-item active" onclick="showPage('users')">👥 利用者一覧</button>
      <button class="menu-item" onclick="showPage('goals')" id="menu-goals">🎯 支援目標</button>
      <button class="menu-item" onclick="showPage('diary')" id="menu-diary">📝 支援日誌</button>
      <button class="menu-item" onclick="showPage('pickup')" id="menu-pickup">⭐ 有効支援ピックアップ</button>
      <button class="menu-item" onclick="showPage('review')" id="menu-review">📊 振り返り・評価</button>
      <button class="menu-item" onclick="showPage('nextplan')" id="menu-nextplan">📋 次期計画策定</button>
    </div>
    <div class="sidebar-footer" style="font-size:11px; color:#aaa;">
      データはブラウザに保存されます<br>
      <button class="btn" style="margin-top:8px;font-size:11px;padding:4px 8px;width:100%" onclick="exportData()">📤 エクスポート</button>
      <button class="btn" style="margin-top:4px;font-size:11px;padding:4px 8px;width:100%" onclick="document.getElementById('import-input').click()">📥 インポート</button>
      <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(this)">
    </div>
  </div>

  <!-- メインコンテンツ -->
  <div class="main">
    <div class="topbar">
      <h2 id="page-title">利用者一覧</h2>
      <div class="topbar-actions" id="topbar-actions">
        <button class="btn primary" onclick="openAddUserModal()">＋ 利用者追加</button>
      </div>
    </div>
    <div class="content" id="main-content">
      <!-- JS で描画 -->
    </div>
  </div>
</div>

<!-- 利用者追加/編集モーダル -->
<div class="modal-overlay" id="user-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="user-modal-title">利用者追加</h3>
      <button class="btn" onclick="closeModal('user-modal')">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>氏名 *</label><input type="text" id="u-name" placeholder="例: 山田 太郎"></div>
      <div class="form-group"><label>ふりがな</label><input type="text" id="u-kana" placeholder="やまだ たろう"></div>
    </div>
    <div class="form-row triple">
      <div class="form-group"><label>生年月日</label><input type="date" id="u-birth"></div>
      <div class="form-group"><label>性別</label>
        <select id="u-gender"><option value="">—</option><option>男性</option><option>女性</option><option>その他</option></select>
      </div>
      <div class="form-group"><label>障害支援区分</label>
        <select id="u-level"><option value="">—</option><option>区分1</option><option>区分2</option><option>区分3</option><option>区分4</option><option>区分5</option><option>区分6</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>サービス種別</label>
        <select id="u-service"><option value="">—</option><option>生活介護</option><option>就労継続支援A型</option><option>就労継続支援B型</option><option>就労移行支援</option><option>共同生活援助</option><option>施設入所支援</option><option>放課後等デイサービス</option><option>その他</option></select>
      </div>
      <div class="form-group"><label>相談支援事業所</label><input type="text" id="u-office" placeholder="事業所名"></div>
    </div>
    <div class="form-row single">
      <div class="form-group"><label>備考・特記事項</label><textarea id="u-memo" placeholder="医療的ケア・コミュニケーション方法など"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('user-modal')">キャンセル</button>
      <button class="btn primary" onclick="saveUser()">保存</button>
    </div>
  </div>
</div>

<!-- 支援日誌 追加/編集モーダル -->
<div class="modal-overlay" id="diary-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="diary-modal-title">支援日誌 記録</h3>
      <button class="btn" onclick="closeModal('diary-modal')">✕</button>
    </div>
    <div class="form-row triple">
      <div class="form-group"><label>日付 *</label><input type="date" id="d-date"></div>
      <div class="form-group"><label>対応者</label><input type="text" id="d-staff" placeholder="担当職員名"></div>
      <div class="form-group"><label>参加状況</label>
        <select id="d-attend"><option>参加</option><option>欠席</option><option>早退</option><option>遅刻</option></select>
      </div>
    </div>
    <div class="form-row single">
      <div class="form-group">
        <label>関連する目標</label>
        <select id="d-goal"><option value="">— 目標を選択（任意）—</option></select>
      </div>
    </div>
    <div class="form-row single">
      <div class="form-group has-voice">
        <label>支援内容・活動</label>
        <textarea id="d-content" placeholder="本日の支援内容・活動内容を記録してください"></textarea>
        <button type="button" class="voice-btn" title="音声入力" onclick="toggleVoice('d-content',this)">🎤</button>
      </div>
    </div>
    <div class="form-row single">
      <div class="form-group has-voice">
        <label>本人の様子・反応</label>
        <textarea id="d-condition" placeholder="体調・気分・言動・反応など"></textarea>
        <button type="button" class="voice-btn" title="音声入力" onclick="toggleVoice('d-condition',this)">🎤</button>
      </div>
    </div>
    <div class="form-row single">
      <div class="form-group has-voice">
        <label>申し送り・次回への課題</label>
        <textarea id="d-note" placeholder="次の支援に向けた引き継ぎ事項"></textarea>
        <button type="button" class="voice-btn" title="音声入力" onclick="toggleVoice('d-note',this)">🎤</button>
      </div>
    </div>
    <div class="form-row single">
      <div class="form-group">
        <label>目標への取り組み評価</label>
        <div class="rating-selector" id="d-rating-sel">
          <button class="rating-btn" data-val="good" onclick="setRating('good')">✓ 良好</button>
          <button class="rating-btn" data-val="mid" onclick="setRating('mid')">△ 普通</button>
          <button class="rating-btn" data-val="bad" onclick="setRating('bad')">✗ 要支援</button>
          <button class="rating-btn" data-val="" onclick="setRating('')">— 未記入</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn danger" id="diary-delete-btn" onclick="deleteDiary()" style="display:none">削除</button>
      <button class="btn" onclick="closeModal('diary-modal')">キャンセル</button>
      <button class="btn primary" onclick="saveDiary()">保存</button>
    </div>
  </div>
</div>

<!-- 支援目標 追加/編集モーダル -->
<div class="modal-overlay" id="goal-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="goal-modal-title">支援目標 設定</h3>
      <button class="btn" onclick="closeModal('goal-modal')">✕</button>
    </div>
    <div class="form-row single">
      <div class="form-group"><label>長期目標</label><textarea id="g-long" placeholder="半年〜1年間で達成を目指す目標"></textarea></div>
    </div>
    <div class="form-row single">
      <div class="form-group"><label>長期目標の手立て</label><textarea id="g-long-support" placeholder="長期目標達成に向けた支援内容・方法"></textarea></div>
    </div>
    <div class="form-row single">
      <div class="form-group"><label>短期目標 *</label><textarea id="g-short" placeholder="今期（3〜6ヶ月）で取り組む具体的な目標"></textarea></div>
    </div>
    <div class="form-row single">
      <div class="form-group"><label>短期目標の手立て</label><textarea id="g-support" placeholder="短期目標達成に向けた具体的な支援内容・方法"></textarea></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>計画開始日</label><input type="date" id="g-start"></div>
      <div class="form-group"><label>計画終了日</label><input type="date" id="g-end"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>担当職員</label><input type="text" id="g-staff" placeholder="担当者名"></div>
      <div class="form-group"><label>達成度（0〜100%）</label><input type="number" id="g-progress" min="0" max="100" value="0" placeholder="0"></div>
    </div>
    <div class="form-row single">
      <div class="form-group"><label>備考</label><textarea id="g-memo" placeholder="その他、特記事項"></textarea></div>

      <button class="btn" onclick="closeModal('goal-modal')">キャンセル</button>
      <button class="btn primary" onclick="saveGoal()">保存</button>
    </div>
  </div>
</div>

<!-- 振り返り記録モーダル -->
<div class="modal-overlay" id="review-modal">

      <button class="btn" onclick="closeModal('review-modal')">キャンセル</button>
      <button class="btn primary" onclick="saveReview()">保存</button>

<script>
// ===================== データ管理 =====================
let _memStore = {}; // localStorageが使えない環境用のフォールバック（その場のみ保持）
let _storageOK = true;

function _read(key) {
  try {
    const raw = localStorage.getItem(key);
    return JSON.parse(raw || '[]');
  } catch (e) {
    return JSON.parse(_memStore[key] || '[]');
  }
}
function _write(key, v) {
  const json = JSON.stringify(v);
  try {
    localStorage.setItem(key, json);
    _memStore[key] = json;
  } catch (e) {
    _memStore[key] = json; // 最低限その場では保持
    if (_storageOK) {
      _storageOK = false;
      alert('⚠ データをブラウザに保存できませんでした。\n\n' +
        'この画面の入力は一時的に保持されますが、ページを閉じると消えます。\n\n' +
        '【考えられる原因】\n' +
        '・プライベート/シークレットウィンドウで開いている\n' +
        '・ブラウザでサイトデータ(Cookie)がブロックされている\n' +
        '・ファイルを直接開いた状態でブラウザが保存を許可していない\n\n' +
        '通常のウィンドウで開き、サイトデータを許可してください。');
    }
  }
}

const DB = {
  get users() { return _read('isp_users'); },
  set users(v) { _write('isp_users', v); },
  get diaries() { return _read('isp_diaries'); },
  set diaries(v) { _write('isp_diaries', v); },
  get goals() { return _read('isp_goals'); },
  set goals(v) { _write('isp_goals', v); },
  get reviews() { return _read('isp_reviews'); },
  set reviews(v) { _write('isp_reviews', v); },
};

let currentPage = 'users';
let selectedUserId = null;
let editingId = null;
let diaryRating = '';

// ===================== ページ切替 =====================
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
  const menuMap = { users: 0, goals: 1, diary: 2, pickup: 3, review: 4, nextplan: 5 };
  document.querySelectorAll('.menu-item')[menuMap[page]].classList.add('active');

  const titles = { users: '利用者一覧', diary: '支援日誌', goals: '支援目標', review: '振り返り・評価', pickup: '有効支援ピックアップ', nextplan: '次期計画策定' };
  document.getElementById('page-title').textContent = titles[page];

  renderPage(page);
}

function renderPage(page) {
  const c = document.getElementById('main-content');
  const actions = document.getElementById('topbar-actions');
  if (page === 'users') {
    actions.innerHTML = `<button class="btn primary" onclick="openAddUserModal()">＋ 利用者追加</button>`;
    renderUsers(c);
  } else if (!selectedUserId) {
    c.innerHTML = `<div class="empty-state"><div class="icon">👆</div><p>左の「利用者一覧」から対象者を選択してください</p></div>`;
    actions.innerHTML = '';
  } else if (page === 'diary') {
    actions.innerHTML = `<button class="btn primary" onclick="openAddDiaryModal()">＋ 日誌追加</button>`;
    renderDiary(c);
  } else if (page === 'pickup') {
    actions.innerHTML = `<button class="btn" onclick="window.print()">🖨 印刷</button>`;
    renderPickup(c);
  } else if (page === 'goals') {
    actions.innerHTML = `<button class="btn primary" onclick="openAddGoalModal()">＋ 目標追加</button>`;
    renderGoals(c);
  } else if (page === 'review') {
    actions.innerHTML = `<button class="btn primary" onclick="openAddReviewModal()">＋ 振り返り追加</button>`;
    renderReview(c);
  } else if (page === 'nextplan') {
    actions.innerHTML = `<button class="btn" onclick="window.print()">🖨 印刷</button>`;
    renderNextPlan(c);
  }
}

// ===================== 利用者 =====================
function renderUsers(c) {
  const users = DB.users;
  let search = '';
  c.innerHTML = `
    <div class="search-bar">
      <input type="text" id="user-search" placeholder="🔍 氏名・サービス種別で検索..." oninput="filterUsers(this.value)">
    </div>
    <div class="user-grid" id="user-grid">${renderUserCards(users, selectedUserId)}</div>
  `;
}

function renderUserCards(users, selectedId) {
  if (!users.length) return `<div class="empty-state" style="grid-column:1/-1"><div class="icon">👥</div><p>利用者を追加してください</p></div>`;
  return users.map(u => {
    const initial = u.name ? u.name[0] : '?';
    return `<div class="user-card ${u.id === selectedId ? 'selected' : ''}" onclick="selectUser('${u.id}')">
      <div class="user-avatar">${initial}</div>
      <div class="user-name">${esc(u.name)}</div>
      <div class="user-meta">${esc(u.service || '—')} ${u.level ? '/ ' + esc(u.level) : ''}</div>
      <div style="margin-top:8px; display:flex; gap:6px; justify-content:flex-end;">
        <button class="btn" style="padding:3px 8px;font-size:11px" onclick="event.stopPropagation(); openEditUserModal('${u.id}')">編集</button>
        <button class="btn danger" style="padding:3px 8px;font-size:11px" onclick="event.stopPropagation(); deleteUser('${u.id}')">削除</button>
      </div>
    </div>`;
  }).join('');
}

function filterUsers(q) {
  const users = DB.users.filter(u => !q || u.name.includes(q) || (u.service && u.service.includes(q)));
  document.getElementById('user-grid').innerHTML = renderUserCards(users, selectedUserId);
}

function selectUser(id) {
  selectedUserId = id;
  renderPage(currentPage);
}

function openAddUserModal() { editingId = null; clearUserForm(); document.getElementById('user-modal-title').textContent = '利用者追加'; openModal('user-modal'); }
function openEditUserModal(id) {
  editingId = id;
  const u = DB.users.find(x => x.id === id);
  if (!u) return;
  document.getElementById('user-modal-title').textContent = '利用者編集';
  document.getElementById('u-name').value = u.name || '';
  document.getElementById('u-kana').value = u.kana || '';
  document.getElementById('u-birth').value = u.birth || '';
  document.getElementById('u-gender').value = u.gender || '';
  document.getElementById('u-level').value = u.level || '';
  document.getElementById('u-service').value = u.service || '';
  document.getElementById('u-office').value = u.office || '';
  document.getElementById('u-memo').value = u.memo || '';
  openModal('user-modal');
}
function clearUserForm() {
  ['u-name','u-kana','u-birth','u-gender','u-level','u-service','u-office','u-memo'].forEach(id => {
    const el = document.getElementById(id); if(el) el.value = '';
  });
}
function saveUser() {
  const name = document.getElementById('u-name').value.trim();
  if (!name) { alert('氏名を入力してください'); return; }
  const users = DB.users;
  const data = {
    name, kana: v('u-kana'), birth: v('u-birth'), gender: v('u-gender'),
    level: v('u-level'), service: v('u-service'), office: v('u-office'), memo: v('u-memo')
  };
  if (editingId) {
    const i = users.findIndex(x => x.id === editingId);
    if (i >= 0) users[i] = { ...users[i], ...data };
  } else {
    users.push({ id: uid(), ...data });
  }
  DB.users = users;
  closeModal('user-modal');
  renderPage(currentPage);
}
function deleteUser(id) {
  if (!confirm('この利用者と関連する全データを削除しますか？')) return;
  DB.users = DB.users.filter(u => u.id !== id);
  DB.diaries = DB.diaries.filter(d => d.userId !== id);
  DB.goals = DB.goals.filter(g => g.userId !== id);
  DB.reviews = DB.reviews.filter(r => r.userId !== id);
  if (selectedUserId === id) selectedUserId = null;
  renderPage(currentPage);
}

// ===================== 支援日誌 =====================
function renderDiary(c) {
  const user = DB.users.find(u => u.id === selectedUserId);
  const diaries = DB.diaries.filter(d => d.userId === selectedUserId).sort((a,b) => b.date.localeCompare(a.date));
  c.innerHTML = `
    <div class="breadcrumb"><a onclick="showPage('users')">利用者一覧</a> › <span>${esc(user?.name || '')}</span> › 支援日誌</div>
    <div class="diary-list">${diaries.length ? diaries.map(renderDiaryItem).join('') : '<div class="empty-state"><div class="icon">📝</div><p>支援日誌がまだありません</p></div>'}</div>
  `;
}
function renderDiaryItem(d) {
  const ratingMap = { good: ['green','✓ 良好'], mid: ['amber','△ 普通'], bad: ['red','✗ 要支援'] };
  const [tagClass, tagLabel] = ratingMap[d.rating] || ['',''];
  const isPickup = !!d.pickup;
  return `<div class="diary-item" onclick="openEditDiaryModal('${d.id}')">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="diary-date">${d.date}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="pickup-btn ${isPickup?'on':''}" onclick="event.stopPropagation();togglePickup('${d.id}')">${isPickup?'⭐ ピックアップ中':'☆ ピックアップ'}</button>
        <div style="font-size:11px;color:#999">${esc(d.staff || '')} / ${esc(d.attend || '参加')}</div>
      </div>
    </div>
    <div class="diary-summary">${esc(d.content || '').substring(0,80)}${(d.content||'').length>80?'…':''}</div>
    ${d.condition ? `<div style="font-size:12px;color:#666;margin-top:4px">様子: ${esc(d.condition).substring(0,60)}</div>` : ''}
    <div class="diary-tags">
      ${tagLabel ? `<span class="tag ${tagClass}">${tagLabel}</span>` : ''}
      ${d.note ? `<span class="tag">申し送りあり</span>` : ''}
    </div>
  </div>`;
}

function togglePickup(id) {
  const diaries = DB.diaries;
  const i = diaries.findIndex(d => d.id === id);
  if (i < 0) return;
  diaries[i].pickup = !diaries[i].pickup;
  diaries[i].pickupMemo = diaries[i].pickupMemo || '';
  DB.diaries = diaries;
  renderPage('diary');
}
function populateDiaryGoalSelect(selectedGoalId) {
  const sel = document.getElementById('d-goal');
  if (!sel) return;
  const goals = DB.goals.filter(g => g.userId === selectedUserId);
  sel.innerHTML = '<option value="">— 目標を選択（任意）—</option>' +
    goals.map(g => `<option value="${g.id}"${g.id === selectedGoalId ? ' selected' : ''}>${esc(g.short.substring(0,30))}${g.short.length > 30 ? '…' : ''}</option>`).join('');
}
function openAddDiaryModal() {
  editingId = null;
  clearDiaryForm();
  document.getElementById('diary-modal-title').textContent = '支援日誌 記録';
  document.getElementById('diary-delete-btn').style.display = 'none';
  document.getElementById('d-date').value = today();
  populateDiaryGoalSelect('');
  openModal('diary-modal');
}
function openEditDiaryModal(id) {
  editingId = id;
  const d = DB.diaries.find(x => x.id === id);
  if (!d) return;
  document.getElementById('diary-modal-title').textContent = '支援日誌 編集';
  document.getElementById('diary-delete-btn').style.display = '';
  document.getElementById('d-date').value = d.date || '';
  document.getElementById('d-staff').value = d.staff || '';
  document.getElementById('d-attend').value = d.attend || '参加';
  document.getElementById('d-content').value = d.content || '';
  document.getElementById('d-condition').value = d.condition || '';
  document.getElementById('d-note').value = d.note || '';
  setRating(d.rating || '');
  populateDiaryGoalSelect(d.goalId || '');
  openModal('diary-modal');
}
function clearDiaryForm() {
  ['d-date','d-staff','d-attend','d-goal','d-content','d-condition','d-note'].forEach(id => {
    const el = document.getElementById(id); if(el) el.value = '';
  });
  setRating('');
}
function setRating(val) {
  diaryRating = val;
  document.querySelectorAll('#d-rating-sel .rating-btn').forEach(btn => {
    btn.className = 'rating-btn';
    const bv = btn.getAttribute('data-val');
    if (bv === val) {
      if (val === 'good') btn.classList.add('active-good');
      else if (val === 'mid') btn.classList.add('active-mid');
      else if (val === 'bad') btn.classList.add('active-bad');
    }
  });
}
function saveDiary() {
  const date = document.getElementById('d-date').value;
  if (!date) { alert('日付を入力してください'); return; }
  const diaries = DB.diaries;
  const data = {
    userId: selectedUserId, date, staff: v('d-staff'), attend: v('d-attend'),
    goalId: v('d-goal'),
    content: v('d-content'), condition: v('d-condition'), note: v('d-note'), rating: diaryRating
  };
  if (editingId) {
    const i = diaries.findIndex(x => x.id === editingId);
    if (i >= 0) diaries[i] = { ...diaries[i], ...data };
  } else {
    diaries.push({ id: uid(), ...data });
  }
  DB.diaries = diaries;
  closeModal('diary-modal');
  renderPage('diary');
}
function deleteDiary() {
  if (!confirm('この日誌を削除しますか？')) return;
  DB.diaries = DB.diaries.filter(d => d.id !== editingId);
  closeModal('diary-modal');
  renderPage('diary');
}

// ===================== 支援目標 =====================
function renderGoals(c) {
  const user = DB.users.find(u => u.id === selectedUserId);
  const goals = DB.goals.filter(g => g.userId === selectedUserId).sort((a,b) => (b.start||'').localeCompare(a.start||''));
  c.innerHTML = `
    <div class="breadcrumb"><a onclick="showPage('users')">利用者一覧</a> › <span>${esc(user?.name || '')}</span> › 支援目標</div>
    ${goals.length ? goals.map(renderGoalItem).join('') : '<div class="empty-state"><div class="icon">🎯</div><p>支援目標がまだありません</p></div>'}
  `;
}
function renderGoalItem(g) {
  const { prog, isAuto, linkedCount } = getDisplayProgress(g);
  const p = Math.min(100, Math.max(0, prog));
  const barColor = p >= 80 ? '#16a34a' : p >= 50 ? '#d97706' : '#1a56db';
  return `<div class="goal-item" onclick="openEditGoalModal('${g.id}')">
    <div class="goal-header">
      <div>
        ${g.long ? `<div style="font-size:13px;font-weight:700;color:#2c2c2a;margin-bottom:4px">長期目標: ${esc(g.long).substring(0,60)}${g.long.length>60?'…':''}</div>` : ''}
        ${g.longSupport ? `<div class="goal-detail" style="color:#999;font-size:11px">長期手立て: ${esc(g.longSupport)}</div>` : ''}
        <div class="goal-title">短期目標: ${esc(g.short)}</div>
        ${g.support ? `<div class="goal-detail">短期手立て:</div>${renderSupportText(g.support)}` : ''}
      </div>
      <div style="text-align:right;flex-shrink:0;margin-left:16px">
        <div style="font-size:20px;font-weight:700;color:${barColor}">${p}%</div>
        ${isAuto ? `<div style="font-size:10px;color:#1a56db">📊 日誌${linkedCount}件から算出</div>` : `<div style="font-size:10px;color:#aaa">手動設定</div>`}
        ${g.staff ? `<div style="font-size:11px;color:#888">${esc(g.staff)}</div>` : ''}
      </div>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar" style="width:${p}%;background:${barColor}"></div></div>
    ${(g.start || g.end) ? `<div class="goal-period">📅 ${esc(g.start||'')} 〜 ${esc(g.end||'')}</div>` : ''}
  </div>`;
}
function openAddGoalModal() {
  editingId = null;
  clearGoalForm();
  document.getElementById('goal-modal-title').textContent = '支援目標 設定';
  document.getElementById('goal-delete-btn').style.display = 'none';
  openModal('goal-modal');
}
function openEditGoalModal(id) {
  editingId = id;
  const g = DB.goals.find(x => x.id === id);
  if (!g) return;
  document.getElementById('goal-modal-title').textContent = '支援目標 編集';
  document.getElementById('goal-delete-btn').style.display = '';
  document.getElementById('g-long').value = g.long || '';
  document.getElementById('g-long-support').value = g.longSupport || '';
  document.getElementById('g-short').value = g.short || '';
  document.getElementById('g-support').value = g.support || '';
  document.getElementById('g-start').value = g.start || '';
  document.getElementById('g-end').value = g.end || '';
  document.getElementById('g-staff').value = g.staff || '';
  document.getElementById('g-progress').value = g.progress || 0;
  document.getElementById('g-memo').value = g.memo || '';
  openModal('goal-modal');
}
function clearGoalForm() {
  ['g-long','g-long-support','g-short','g-support','g-start','g-end','g-staff','g-progress','g-memo'].forEach(id => {
    const el = document.getElementById(id); if(el) el.value = '';
  });
  document.getElementById('g-progress').value = 0;
}
function saveGoal() {
  const short = document.getElementById('g-short').value.trim();
  if (!short) { alert('短期目標を入力してください'); return; }
  const goals = DB.goals;
  const data = {
    userId: selectedUserId, long: v('g-long'), longSupport: v('g-long-support'), short, support: v('g-support'),
    start: v('g-start'), end: v('g-end'), staff: v('g-staff'),
    progress: parseInt(v('g-progress')) || 0, memo: v('g-memo')
  };
  if (editingId) {
    const i = goals.findIndex(x => x.id === editingId);
    if (i >= 0) goals[i] = { ...goals[i], ...data };
  } else {
    goals.push({ id: uid(), ...data });
  }
  DB.goals = goals;
  closeModal('goal-modal');
  renderPage('goals');
}
function deleteGoal() {
  if (!confirm('この目標を削除しますか？')) return;
  DB.goals = DB.goals.filter(g => g.id !== editingId);
  closeModal('goal-modal');
  renderPage('goals');
}

// ===================== ピックアップ一覧 =====================
function renderPickup(c) {
  const user = DB.users.find(u => u.id === selectedUserId);
  const allPickups = DB.diaries.filter(d => d.userId === selectedUserId && d.pickup)
    .sort((a, b) => a.date.localeCompare(b.date));

  const filterVal = document.getElementById('pickup-filter') ? document.getElementById('pickup-filter').value : '';
  const filtered = filterVal ? allPickups.filter(d => d.rating === filterVal) : allPickups;

  c.innerHTML = `
    <div class="breadcrumb"><a onclick="showPage('users')">利用者一覧</a> › <span>${esc(user?.name || '')}</span> › 有効支援ピックアップ</div>
    <div class="card">
      <div class="card-header">
        <h3>⭐ 有効な支援 一覧表 <span style="font-weight:400;color:#888;font-size:12px">— ${esc(user?.name||'')} さん</span></h3>
        <div style="display:flex;gap:8px;align-items:center">
          <select id="pickup-filter" style="font-size:12px;padding:4px 8px;border:1px solid #ddd;border-radius:6px" onchange="renderPickup(document.getElementById('main-content'))">
            <option value="">すべて</option>
            <option value="good" ${filterVal==='good'?'selected':''}>✓ 良好のみ</option>
            <option value="mid" ${filterVal==='mid'?'selected':''}>△ 普通のみ</option>
            <option value="bad" ${filterVal==='bad'?'selected':''}>✗ 要支援のみ</option>
          </select>
          <span style="font-size:12px;color:#888">${filtered.length}件</span>
        </div>
      </div>
      <div class="card-body" style="padding:0;overflow-x:auto">
        ${filtered.length ? `
        <table class="pickup-table">
          <thead>
            <tr>
              <th style="width:100px">日付</th>
              <th style="width:80px">担当者</th>
              <th>支援内容・活動</th>
              <th>本人の様子・反応</th>
              <th style="width:80px">評価</th>
              <th>申し送り・課題</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(d => {

function addVoiceBtns(container) {
  if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) return;
  container.querySelectorAll('textarea:not(.voice-done)').forEach(ta => {
    ta.classList.add('voice-done');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'voice-btn';
    btn.title = '音声入力';
    btn.textContent = '🎤';
    btn.setAttribute('onclick', `toggleVoice('${ta.id}', this)`);
    ta.insertAdjacentElement('afterend', btn);
    const fg = ta.closest('.form-group');
    if (fg) fg.classList.add('has-voice');
  });
}

function exportData() {

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '個別支援データ_' + today() + '.json';

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.users || !data.diaries) { alert('形式が正しくありません'); return; }
      const exU = new Set(DB.users.map(u => u.id));
      const exD = new Set(DB.diaries.map(d => d.id));
      const exG = new Set(DB.goals.map(g => g.id));
      const exR = new Set(DB.reviews.map(r => r.id));
      DB.users = [...DB.users, ...data.users.filter(u => !exU.has(u.id))];
      DB.diaries = [...DB.diaries, ...data.diaries.filter(d => !exD.has(d.id))];
      DB.goals = [...DB.goals, ...(data.goals || []).filter(g => !exG.has(g.id))];
      DB.reviews = [...DB.reviews, ...(data.reviews || []).filter(r => !exR.has(r.id))];
      input.value = '';
      alert('インポートしました。利用者: +' + data.users.filter(u => !exU.has(u.id)).length +
        '件、日誌: +' + data.diaries.filter(d => !exD.has(d.id)).length + '件');
      renderPage(currentPage);
    } catch (err) { alert('読み込みエラー: ' + err.message); }
  };
  reader.readAsText(file);
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// 短期目標の手立て（①②③…形式の具体的項目）を項目ごとに分割する。
// マーカーが2件未満（＝箇条書きされていない）場合は null を返し、呼び出し側で通常表示にフォールバックする。
const NUMBERED_MARKER_RE = /(?:^|\n)[ \t]*([①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳])[ \t]*/g;
function splitNumberedItems(text) {
  const t = (text || '').trim();
  if (!t) return null;
  const matches = [...t.matchAll(NUMBERED_MARKER_RE)];
  if (matches.length < 2) return null;
  return matches.map((m, i) => {
    const start = m.index + m[0].length;
    const end = i + 1 < matches.length ? matches[i + 1].index : t.length;
    return { num: m[1], body: t.slice(start, end).trim() };
  });
}

// ===================== 振り返り評価：短期目標の項目ごとの記録 =====================
// 指定した支援目標の短期手立てを①②③…単位に分解し、振り返り入力の土台（num, text）を作る。
// 手立てが箇条書きされていなければ、短期目標そのものを1項目として扱う。
function getGoalReviewItems(goalId) {
  const g = DB.goals.find(x => x.id === goalId);
  if (!g) return [];
  const parsed = splitNumberedItems(g.support);
  if (parsed) return parsed.map(it => ({ num: it.num, text: it.body }));
  if ((g.short || '').trim()) return [{ num: '', text: g.short }];
  return [];
}
// 振り返り記録から項目別の評価配列を得る。新形式（items）があればそれを、
// 旧形式（selfNote/staffNote/nextNote の単一テキスト）しかなければ1項目に変換して返す。
function reviewItems(r) {
  if (r.items && r.items.length) return r.items;
  if (r.selfNote || r.staffNote || r.nextNote) {
    return [{ num: '', text: '', self: r.selfNote || '', staff: r.staffNote || '', next: r.nextNote || '' }];
  }
  return [];
}
function populateReviewGoalSelect(selectedGoalId) {

  if (!sel) return;

let reviewItemsState = [];
// 現在選択中の短期目標の項目に、既存の入力内容（あれば）を突き合わせる。
// 目標の項目に対応しない内容（例: 長期目標の評価など、旧データ由来の「総合」項目）は
// 先頭に残したまま保持し、編集時にデータが消えないようにする。
function buildReviewItems(existingItems) {
  const goalId = document.getElementById('rv-goal').value;
  const base = goalId ? getGoalReviewItems(goalId) : [];
  const prevList = (existingItems || reviewItemsState || []).map(it => ({ ...it }));
  if (!base.length) return prevList;

  const used = new Array(prevList.length).fill(false);
  const mapped = base.map(b => {
    const idx = prevList.findIndex((e, i) => !used[i] && e.num === b.num && e.text === b.text);
    if (idx >= 0) {
      used[idx] = true;
      return { num: b.num, text: b.text, self: prevList[idx].self || '', staff: prevList[idx].staff || '', next: prevList[idx].next || '' };
    }
    return { num: b.num, text: b.text, self: '', staff: '', next: '' };
  });
  const leftover = prevList.filter((e, i) => !used[i]);
  return leftover.concat(mapped);
}
function renderReviewItemFields(existingItems) {
  reviewItemsState = buildReviewItems(existingItems);

  const c = document.getElementById('rv-items-container');
  if (!reviewItemsState.length) {

// 紐付いた日誌の評価から達成度を自動計算（良好=100, 普通=50, 要支援=0 の平均）
// 評価が代表的でない場合は null を返す（→手動値にフォールバック）。
// ・評価済みが0件
// ・評価済みが紐付け日誌の過半数に満たない（例: 有効支援だけ「良好」を付けた状態だと
//   全部良好＝100%という偏った値になり実態を表さないため、自動計算しない）
function calcGoalProgress(goalId) {
  const linked = DB.diaries.filter(d => d.goalId === goalId);
  const rated = linked.filter(d => d.rating);
  if (!rated.length) return null;
  if (rated.length * 2 < linked.length) return null; // 評価が過半数未満なら代表性なしとみなす
  const score = { good: 100, mid: 50, bad: 0 };
  return Math.round(rated.reduce((s, d) => s + (score[d.rating] || 0), 0) / rated.length);
}
// 自動計算値があればそちら、なければ手動設定値
function getDisplayProgress(g) {
  const auto = calcGoalProgress(g.id);
  return { prog: auto !== null ? auto : (parseInt(g.progress) || 0), isAuto: auto !== null,
           linkedCount: DB.diaries.filter(d => d.goalId === g.id && d.rating).length };
}

(function setupVoice() {
  try {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      // 音声認識非対応ブラウザでは、HTMLに直書きされたマイクボタンを消す（押してもエラーになるため）
      document.querySelectorAll('.voice-btn').forEach(b => b.style.display = 'none');
      return;
    }

    let recog = null;
    let activeBtn = null;
    let activeTarget = null;
    let baseText = '';       // 録音開始時点のテキスト
    let manualStop = false;  // ユーザーが停止ボタンを押したか
    let fileWarned = false;  // file:// 警告は一度だけ

    function stopRecog() {
      manualStop = true;
      if (recog) { try { recog.onend = null; recog.stop(); } catch(e){} recog = null; }
      if (activeBtn) { activeBtn.classList.remove('recording'); activeBtn.textContent = '🎤'; }
      activeBtn = null; activeTarget = null;
    }

    function startRecog() {
      recog = new SpeechRecognition();
      recog.lang = 'ja-JP';
      recog.continuous = true;
      recog.interimResults = true;  // 途中経過もリアルタイム表示
      recog.onresult = e => {
        let finalText = '';
        let interim = '';
        for (let i = 0; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) finalText += t;
          else interim += t;
        }
        if (finalText) {
          baseText = baseText + (baseText && !baseText.endsWith('\n') ? '\n' : '') + finalText;
        }
        const sep = baseText && !baseText.endsWith('\n') ? '\n' : '';
        activeTarget.value = baseText + (interim ? sep + interim : '');
      };
      recog.onerror = ev => {
        const err = ev && ev.error ? ev.error : '';
        // no-speech / aborted は無視して聞き続ける（onend で自動再開）
        if (err === 'no-speech' || err === 'aborted') return;
        const handled = activeBtn;
        stopRecog();
        let msg;
        if (err === 'not-allowed' || err === 'service-not-allowed') {
          msg = 'マイクの使用が許可されていません。\n\n' +
            '・ブラウザのアドレスバーのマイクアイコンから「許可」してください。\n' +
            '・ファイルを直接開いている場合（file://）は許可ダイアログが出ません。' +
            'ローカルサーバー経由か https で開いてください。';
        } else if (err === 'network') {
          msg = '音声認識サーバーに接続できませんでした。\n\n' +
            'インターネット接続を確認のうえ、http(s) 経由で開いてください。';
        } else if (err === 'audio-capture') {
          msg = 'マイクが見つかりません。Windowsのサウンド設定で入力マイクと音量を確認してください。';
        } else {
          msg = '音声入力でエラーが発生しました（' + (err || '不明') + '）。';
        }
        if (handled) alert('🎤 ' + msg);
      };
      recog.onend = () => {
        // 停止ボタンを押していなければ自動で再開（無音タイムアウト対策）
        if (!manualStop && activeBtn) {
          try { recog.start(); } catch(e) { setTimeout(() => { if (!manualStop && activeBtn) startRecog(); }, 300); }
        }
      };
      recog.start();
    }

    window.toggleVoice = function(targetId, btn) {
      try {
        if (activeBtn === btn) { stopRecog(); return; }
        stopRecog();
        const el = document.getElementById(targetId);
        if (!el) return;
        manualStop = false;
        activeBtn = btn; activeTarget = el;
        baseText = el.value;
        btn.classList.add('recording'); btn.textContent = '⏹';
        if (location.protocol === 'file:' && !fileWarned) {
          fileWarned = true;
          alert('🎤 ファイルを直接開いている（file://）ため、音声入力が動作しない場合があります。\n\n' +
            'うまくいかないときは、ローカルサーバー経由か https でこのページを開いてください。');
        }
        startRecog();
      } catch(e) {
        stopRecog();
        alert('🎤 音声入力を開始できませんでした: ' + (e && e.message ? e.message : e));
      }
    };

    // モーダル内の全テキストエリアにマイクボタンを追加
    document.querySelectorAll('.modal textarea').forEach(ta => {
      try {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'voice-btn';
        btn.title = '音声入力';
        btn.textContent = '🎤';
        btn.setAttribute('onclick', `toggleVoice('${ta.id}', this)`);
        if (ta.nextElementSibling && ta.nextElementSibling.classList.contains('voice-btn')) return;
        ta.insertAdjacentElement('afterend', btn);
        const fg = ta.closest('.form-group');
        if (fg) fg.classList.add('has-voice');
      } catch(e) {}
    });
  } catch(e) {}
})();

// ===================== 重複利用者の統合（TA = 記録対象者） =====================
// 「TA」と「記録対象者」は同一人物。両者の日誌・目標・振り返りを1人にまとめる。
// 一度だけ実行。再読み込みしても再実行しません。
(function mergeDuplicateUsers() {
  const MERGE_FLAG = 'isp_merge_dupe_v1';
  try { if (localStorage.getItem(MERGE_FLAG)) return; } catch (e) { return; }

  const DUPE_NAMES = ['TA', '記録対象者'];
  const users = DB.users;
  const group = users.filter(u => DUPE_NAMES.includes((u.name || '').trim()));

  // 新規環境では「記録対象者」1人だけが作成されるため、重複がなくても表示名を「TA」に統一する
  // （後続の処理・画面表記はすべて「TA」を前提としているため）
  if (group.length === 1 && (group[0].name || '').trim() === '記録対象者') {
    group[0].name = 'TA';
    DB.users = users.map(u => u.id === group[0].id ? group[0] : u);
  }

  // 同一人物候補が2件以上ある場合のみ統合
  if (group.length >= 2) {
    // 生き残り: 「記録対象者」を優先、なければ先頭
    const survivor = group.find(u => (u.name || '').trim() === '記録対象者') || group[0];
    const mergedIds = group.filter(u => u.id !== survivor.id).map(u => u.id);

    // プロフィールの空欄を、もう一方の値で補完
    group.forEach(u => {
      if (u.id === survivor.id) return;
      ['kana', 'birth', 'gender', 'level', 'service', 'office', 'memo'].forEach(f => {
        if (!survivor[f] && u[f]) survivor[f] = u[f];
      });
    });

    // 統合後の氏名は「TA」にする
    survivor.name = 'TA';

    // 子レコードを survivor に付け替え
    const reassign = arr => arr.map(x => mergedIds.includes(x.userId) ? { ...x, userId: survivor.id } : x);
    DB.diaries = reassign(DB.diaries);
    DB.goals = reassign(DB.goals);
    DB.reviews = reassign(DB.reviews);

    // 重複ユーザーを削除し、survivor を更新
    DB.users = users
      .filter(u => !mergedIds.includes(u.id))
      .map(u => u.id === survivor.id ? survivor : u);

    selectedUserId = survivor.id;
  }

  try { localStorage.setItem(MERGE_FLAG, '1'); } catch (e) {}
})();

// ===================== 重複日誌のクリーンアップ（ピックアップ一覧のダブり対策） =====================
// 同一利用者で「日付＋支援内容」が完全に一致する日誌が複数ある場合は1件に統合する。
// 統合時はピックアップ状態・評価・担当者などの情報を失わないよう残す側へ引き継ぐ。
// フラグは使わず毎回点検し、重複があった時だけ保存し直す（無ければ何もしない＝自己修復）。
(function dedupeDiaries() {
  const diaries = DB.diaries;
  const seen = new Map();   // key -> 残す日誌レコード
  const kept = [];
  let removed = 0;
  diaries.forEach(d => {
    const key = [d.userId, d.date, (d.content || '').trim()].join('|');
    if (seen.has(key)) {
      // 既出と完全一致 → 残す側に情報を引き継ぎ、こちらは破棄
      const keep = seen.get(key);
      if (d.pickup) keep.pickup = true;
      if (!keep.rating && d.rating) keep.rating = d.rating;
      if (!keep.staff && d.staff) keep.staff = d.staff;
      if (!keep.condition && d.condition) keep.condition = d.condition;
      if (!keep.note && d.note) keep.note = d.note;
      if (!keep.goalId && d.goalId) keep.goalId = d.goalId;
      removed++;
    } else {
      seen.set(key, d);
      kept.push(d);
    }
  });
  if (removed > 0) {
    DB.diaries = kept;
    try { console.info('[個別支援管理] 重複していた日誌を ' + removed + ' 件、1件に統合しました。'); } catch (e) {}
  }
})();

    '2026-04-01', // 順番を守れた・仕付けを自分で声に出して取り組んだ
    '2026-04-20', // 内容が変わっても手指活動への意欲と集中が続いた
    '2026-04-22', // 隣の人の名前を聞こうとした（対人への積極的な関心）
    '2026-04-27', // 自分から課題を申し出て最後まで集中（自主性＋集中力）
    '2026-04-28', // 励ましを受けて意欲が出た（称賛の有効性確認）
    '2026-04-29', // 気持ちを言葉で表す・自己選択で自信につながってきている
    '2026-05-04', // 「終わった」と言葉で伝えようとする場面が増えた
    '2026-06-17', // 肯定的な声かけを続けると意欲的に取り組む場面が増えた
    // --- 正確版記録から追加で判断した有効支援（2月・3月前半・5月）---
    '2026-02-05', // 支援者がそばに座ると集中が続く（存在による環境支援が有効）
    '2026-03-05', // 具体的な声かけ＋ハンドサインで自立行動（身体を拭く・着席）
    '2026-03-10', // 落ち着ける課題の組み合わせ・環境設定で自分のペースで楽しめ待てた
    '2026-04-23', // トイレのサインが継続支援で定着・自分で考えて型はめ
    '2026-05-07', // 好きな物（おやつ）を見せて気持ちを切り替えられた
    '2026-05-19', // 待ち時間に手元活動（スピーズ入れ）を手渡すと笑顔で安定
    '2026-05-28'  // 新しい支援者の声かけにも笑顔（短期目標「新しい支援者に慣れる」に直結）
  ]);
  const MID = new Set([
    '2026-03-27', // 考えながら答えられたがやや不安定
    '2026-04-21', // 長く続いたが達成の手ごたえがやや薄め
    '2026-04-26'  // 積極的だが具体的な達成がやや不明確
  ]);
  const BAD = new Set([
    '2026-03-30'  // 多く声かけられてうんざりする様子（支援の過多が裏目）
  ]);

  const target = DB.users.find(u => (u.name || '').trim() === 'TU');
  if (!target) return;
  const diaries = DB.diaries;
  let changed = 0;
  diaries.forEach(d => {
    if (d.userId !== target.id) return;
    // 評価が未設定なら補う（既存の評価は尊重して上書きしない）
    if (!d.rating) {
      if (GOOD.has(d.date))      d.rating = 'good';
      else if (MID.has(d.date))  d.rating = 'mid';
      else if (BAD.has(d.date))  d.rating = 'bad';
      else                       d.rating = 'good';
      changed++;
    }
    // GOOD該当日はピックアップ未設定なら必ず立てる（評価の有無に関わらず＝自己修復）
    if (GOOD.has(d.date) && !d.pickup) { d.pickup = true; changed++; }
  });
  if (changed) DB.diaries = diaries;
}

// フラグは使わず毎回点検し、未紐付けの日誌があれば補う自己修復方式。
(function linkTUDiariesToGoal() {
  const target = DB.users.find(u => (u.name || '').trim() === 'TU');
  if (!target) return;

  const goals = DB.goals.filter(g => g.userId === target.id);
  if (!goals.length) return;

  const goalId = goals[0].id;
  const diaries = DB.diaries;
  let n = 0;
  diaries.forEach(d => { if (d.userId === target.id && !d.goalId) { d.goalId = goalId; n++; } });
  if (n) DB.diaries = diaries;
})();

      '② 自分の気持ちや要求を伝える手段を広げることができる。\n' +
      '　→ トイレのハンドサイン（今期3/5・4/23で定着）を継続し、「終わり」「もっと」「嫌」などの意思表示も' +
      'サイン・絵カードで拡充する。伝えられた時は気持ちを汲み取り、言葉にして返す。\n' +
      '③ 手指を使ったあそびや勉強、レクリエーションに取り組み続けることができる。\n' +
      '　→ スピーズ入れ・ストロー通し・型はめ・制作を継続し、新しい課題は楽しみながら取り組める環境設定のもと' +
      '段階的に導入する（今期A評価の具体的目標③を維持・発展）。';
    const memo =
      '次期計画（2026年7月〜12月）。今期振り返り（総合評価B・長期目標C評価）と次期への引き継ぎ事項、' +
      '有効支援ピックアップ20件より作成。①〜③は短期目標の具体的目標と支援内容。' +
      '判読不能箇所「？」の事実確認をチームで行った上で、サービス管理責任者が内容を確認・修正すること。';

    const goals = DB.goals;
    const existing = goals.find(g => g.userId === tu.id && (g.short || '').trim() === shortGoal);
    if (existing) {
      if ((existing.support || '').includes('④ 声かけは量とタイミングを調整する')) {
        existing.support = support; existing.long = longGoal;
        existing.longSupport = longSupport; existing.memo = memo;
        DB.goals = goals; seeded++;
      }
    } else {
      goals.push({
        id: uid(), userId: tu.id, long: longGoal, longSupport: longSupport,
        short: shortGoal, support: support,
        start: START, end: END, staff: '和田', progress: 0, memo: memo
      });
      DB.goals = goals; seeded++;
    }
  }

  // 作成した次期目標をすぐ確認できるよう、支援目標画面を開く（TAさんを選択）
  if (seeded && ta) { selectedUserId = ta.id; currentPage = 'goals'; }
  try { localStorage.setItem(FLAG, '1'); } catch (e) {}
})();

// ===================== 振り返り記録の職員評価を短期目標の項目へ再割当て =====================
// 旧版の振り返り記録は職員評価を一つのテキストにまとめていたが、その中には
// 【具体的目標①】〜【具体的目標③】として、短期目標の手立て①〜③に対応する評価が
// 個別に書かれている。この対応関係を検出し、短期目標の項目数（①②③）に一致する場合に限り
// items（項目別記録）へ変換する。長期目標の評価や支援結果の分類など、
// どの項目にも対応しない内容は「総合」項目としてまとめ、データを失わないようにする。
(function migrateReviewItemsFromLegacyStaffNote() {
  const FLAG = 'isp_migrate_review_items_v1';
  try { if (localStorage.getItem(FLAG)) return; } catch (e) { return; }

  const reviews = DB.reviews;
  let migrated = 0;

  reviews.forEach(r => {
    if (r.items && r.items.length) return; // 既に項目化済み
    const staffNote = r.staffNote || '';
    const parsed = splitNumberedItems(staffNote);
    if (!parsed) return;

    const goal = DB.goals.find(g => g.userId === r.userId && (g.short || '').trim() && staffNote.includes(g.short.trim()));
    if (!goal) return;
    const goalItems = getGoalReviewItems(goal.id);
    if (!goalItems.length) return;

    const specific = parsed.filter(p => /^【具体的目標/.test(p.body));
    if (specific.length !== goalItems.length) return; // 件数が一致しない場合は自動変換しない

    const others = parsed.filter(p => !/^【具体的目標/.test(p.body));
    const overallStaff = others.map(p => p.num + ' ' + p.body).join('\n');

    const items = [];
    if (overallStaff || r.selfNote || r.nextNote) {
      items.push({
        num: '', text: '総合（長期目標の評価・支援結果の傾向など）',
        self: r.selfNote || '', staff: overallStaff, next: r.nextNote || ''
      });
    }
    goalItems.forEach((gi, i) => {
      items.push({
        num: gi.num, text: gi.text, self: '',
        staff: specific[i].body.replace(/^【具体的目標[^】]*】/, '').trim(),
        next: ''
      });
    });

    r.goalId = goal.id;
    r.items = items;
    migrated++;
  });

  if (migrated) {
    DB.reviews = reviews;
    try { console.info('[個別支援管理] 振り返り記録 ' + migrated + ' 件を短期目標の項目別評価に変換しました。'); } catch (e) {}
  }
  try { localStorage.setItem(FLAG, '1'); } catch (e) {}
})();

// 初期表示：自動処理で対象画面が指定されていればそれを開く（無ければ利用者一覧）
if (selectedUserId && currentPage !== 'users') {
  showPage(currentPage);
} else {
  renderPage('users');
}
</script>
