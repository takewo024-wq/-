<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>姉川の合戦 サムネイル</title>
</head>
<body style="margin:0;padding:0;">
<div style="position:relative;width:1280px;height:670px;overflow:hidden;font-family:'Noto Sans JP','IPAGothic',sans-serif;background:
  radial-gradient(ellipse at 50% 30%, #2a1f1f 0%, #1a1210 45%, #0c0808 100%);">

  <!-- distant mountains silhouette -->
  <div style="position:absolute;bottom:180px;left:-40px;width:1360px;height:220px;
    background:#100a0a;
    clip-path:polygon(0% 100%, 0% 60%, 8% 40%, 16% 58%, 26% 30%, 36% 55%, 48% 20%, 60% 50%, 70% 32%, 82% 54%, 92% 38%, 100% 58%, 100% 100%);"></div>

  <!-- river band with red tint (blood/river motif) -->
  <div style="position:absolute;bottom:0;left:0;width:1280px;height:190px;
    background:linear-gradient(180deg, rgba(122,31,31,0.05) 0%, rgba(122,31,31,0.35) 40%, rgba(60,10,10,0.75) 100%);"></div>
  <div style="position:absolute;bottom:70px;left:0;width:1280px;height:3px;background:rgba(230,190,120,0.35);"></div>
  <div style="position:absolute;bottom:40px;left:0;width:1280px;height:2px;background:rgba(230,190,120,0.2);"></div>

  <!-- gold frame -->
  <div style="position:absolute;top:22px;left:22px;width:1236px;height:626px;border:2px solid rgba(212,175,110,0.55);box-sizing:border-box;"></div>
  <div style="position:absolute;top:30px;left:30px;width:1220px;height:610px;border:1px solid rgba(212,175,110,0.3);box-sizing:border-box;"></div>

  <!-- corner accents -->
  <div style="position:absolute;top:34px;left:34px;width:46px;height:46px;border-top:3px solid #d4af6e;border-left:3px solid #d4af6e;"></div>
  <div style="position:absolute;top:34px;right:34px;width:46px;height:46px;border-top:3px solid #d4af6e;border-right:3px solid #d4af6e;"></div>
  <div style="position:absolute;bottom:34px;left:34px;width:46px;height:46px;border-bottom:3px solid #d4af6e;border-left:3px solid #d4af6e;"></div>
  <div style="position:absolute;bottom:34px;right:34px;width:46px;height:46px;border-bottom:3px solid #d4af6e;border-right:3px solid #d4af6e;"></div>

  <!-- era tag -->
  <div style="position:absolute;top:82px;left:0;width:1280px;text-align:center;">
    <span style="display:inline-block;padding:7px 26px;border:1px solid rgba(212,175,110,0.6);border-radius:2px;color:#e6c98a;font-size:17px;letter-spacing:6px;">元亀元年（1570）六月二十八日</span>
  </div>

  <!-- main title -->
  <div style="position:absolute;top:200px;left:0;width:1280px;text-align:center;">
    <div style="font-size:104px;font-weight:900;color:#f5ead2;letter-spacing:14px;text-shadow:0 0 40px rgba(180,30,30,0.55), 0 4px 10px rgba(0,0,0,0.6);">姉川の合戦</div>
  </div>

  <!-- subtitle -->
  <div style="position:absolute;top:340px;left:0;width:1280px;text-align:center;">
    <div style="font-size:29px;font-weight:700;color:#e8b4b4;letter-spacing:3px;">義理と裏切り、九死に一生の金ヶ崎退き口</div>
  </div>

  <!-- divider -->
  <div style="position:absolute;top:400px;left:490px;width:300px;height:1px;background:rgba(212,175,110,0.5);"></div>
  <div style="position:absolute;top:396px;left:630px;width:9px;height:9px;background:#d4af6e;transform:rotate(45deg);"></div>

  <!-- factions -->
  <div style="position:absolute;top:430px;left:0;width:1280px;text-align:center;">
    <span style="font-size:24px;font-weight:700;color:#9db8d8;">織田・徳川</span>
    <span style="font-size:20px;color:#c9b48a;margin:0 18px;">対</span>
    <span style="font-size:24px;font-weight:700;color:#d99a9a;">浅井・朝倉</span>
  </div>

  <!-- bottom tagline -->
  <div style="position:absolute;bottom:88px;left:0;width:1280px;text-align:center;">
    <div style="font-size:19px;color:#c9b48a;letter-spacing:2px;">戦国史研究家が読み解く、背景・合戦の全経過・布陣図・現地案内</div>
  </div>

</div>
</body>
</html>
