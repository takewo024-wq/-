<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090" font-family="IPAGothic, sans-serif">
  <defs>
    <linearGradient id="riv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc3d6"/>
      <stop offset="0.5" stop-color="#6ba7c4"/>
      <stop offset="1" stop-color="#9cc3d6"/>
    </linearGradient>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#7a1f1f"/>
    </marker>
    <marker id="arb" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M0,0 L11,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>

  <!-- parchment background -->
  <rect width="1200" height="1090" fill="#f4ead0"/>
  <rect x="14" y="14" width="1172" height="1062" fill="none" stroke="#b79b5e" stroke-width="3"/>
  <rect x="22" y="22" width="1156" height="1046" fill="none" stroke="#b79b5e" stroke-width="1"/>

  <!-- title -->
  <text x="600" y="70" text-anchor="middle" font-size="42" font-weight="bold" fill="#3a2a12">姉川の合戦 布陣略図</text>
  <text x="600" y="104" text-anchor="middle" font-size="20" fill="#6b5a34">元亀元年（1570）6月28日・近江国 姉川河畔</text>

  <!-- compass -->
  <g transform="translate(1090,150)">
    <circle r="34" fill="#fff8e7" stroke="#b79b5e" stroke-width="2"/>
    <path d="M0,-26 L9,6 L0,-2 L-9,6 z" fill="#7a1f1f"/>
    <text x="0" y="-30" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a2a12">北</text>
  </g>

  <!-- 小谷城 (north) -->
  <g transform="translate(600,150)">
    <path d="M-26,18 L-26,-6 L-13,-6 L-13,-16 L0,-24 L13,-16 L13,-6 L26,-6 L26,18 z" fill="#8a6d3b" stroke="#5c4423" stroke-width="2"/>
    <text x="0" y="46" text-anchor="middle" font-size="19" font-weight="bold" fill="#3a2a12">小谷城</text>
    <text x="0" y="66" text-anchor="middle" font-size="14" fill="#6b5a34">浅井本拠</text>
  </g>

  <!-- NORTH BANK label -->
  <text x="80" y="250" font-size="17" fill="#8a7748">〔北岸〕浅井・朝倉軍</text>

  <!-- Asakura (north-west) -->
  <g transform="translate(340,320)">
    <rect x="-140" y="-46" width="280" height="92" rx="8" fill="#e7d3d0" stroke="#7a1f1f" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="30" font-weight="bold" fill="#7a1f1f">朝倉軍</text>
    <text x="0" y="24" text-anchor="middle" font-size="19" fill="#5c2323">大将・朝倉景健</text>
  </g>

  <!-- Asai (north-east) -->
  <g transform="translate(860,320)">
    <rect x="-140" y="-46" width="280" height="92" rx="8" fill="#e7d3d0" stroke="#7a1f1f" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="30" font-weight="bold" fill="#7a1f1f">浅井軍</text>
    <text x="0" y="24" text-anchor="middle" font-size="19" fill="#5c2323">大将・浅井長政</text>
  </g>

  <!-- RIVER -->
  <rect x="26" y="430" width="1148" height="86" fill="url(#riv)"/>
  <path d="M26,448 Q150,438 300,448 T600,448 T900,448 T1174,448" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <path d="M26,498 Q150,488 300,498 T600,498 T900,498 T1174,498" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <text x="600" y="484" text-anchor="middle" font-size="30" font-weight="bold" fill="#123" opacity="0.85">姉　川</text>
  <text x="1150" y="470" text-anchor="end" font-size="13" fill="#123" opacity="0.7">（東→西へ流れる）</text>

  <!-- SOUTH BANK label -->
  <text x="80" y="600" font-size="17" fill="#8a7748">〔南岸〕織田・徳川軍</text>

  <!-- Tokugawa (south-west) -->
  <g transform="translate(340,660)">
    <rect x="-140" y="-46" width="280" height="92" rx="8" fill="#d3ddec" stroke="#1f3a5f" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="30" font-weight="bold" fill="#1f3a5f">徳川軍</text>
    <text x="0" y="24" text-anchor="middle" font-size="19" fill="#23314f">大将・徳川家康</text>
  </g>

  <!-- Oda (south-east) -->
  <g transform="translate(860,660)">
    <rect x="-140" y="-46" width="280" height="92" rx="8" fill="#d3ddec" stroke="#1f3a5f" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="30" font-weight="bold" fill="#1f3a5f">織田軍</text>
    <text x="0" y="24" text-anchor="middle" font-size="19" fill="#23314f">大将・織田信長</text>
  </g>

  <!-- 横山城 (south) -->
  <g transform="translate(600,810)">
    <path d="M-24,16 L-24,-6 L-12,-6 L-12,-15 L0,-22 L12,-15 L12,-6 L24,-6 L24,16 z" fill="#6b7d55" stroke="#3f4a33" stroke-width="2"/>
    <text x="0" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#3a2a12">横山城</text>
    <text x="0" y="62" text-anchor="middle" font-size="13" fill="#6b5a34">浅井の支城／織田方が包囲</text>
  </g>

  <!-- ===== ARROWS ===== -->
  <!-- Oda vs Asai clash (vertical, east) -->
  <line x1="860" y1="606" x2="860" y2="372" stroke="#1f3a5f" stroke-width="4" marker-end="url(#arb)" opacity="0.85"/>
  <line x1="815" y1="372" x2="815" y2="606" stroke="#7a1f1f" stroke-width="4" marker-end="url(#ar)" opacity="0.85"/>

  <!-- Tokugawa pushes Asakura (vertical, west) -->
  <line x1="300" y1="606" x2="300" y2="372" stroke="#1f3a5f" stroke-width="4" marker-end="url(#arb)" opacity="0.85"/>

  <!-- Tokugawa flank arrow: curve to Asakura's side (west flank) -->
  <path d="M210,640 C90,560 100,400 250,352" fill="none" stroke="#1f3a5f" stroke-width="5" stroke-dasharray="2 0" marker-end="url(#arb)"/>
  <text x="70" y="520" font-size="16" font-weight="bold" fill="#1f3a5f" transform="rotate(-78 70 520)">徳川勢 側面へ回り込み</text>

  <!-- Asai retreat north after collapse -->
  <path d="M900,268 C930,210 900,190 700,175" fill="none" stroke="#7a1f1f" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#ar)"/>
  <text x="905" y="225" font-size="15" fill="#7a1f1f">総崩れ→北へ敗走</text>

  <!-- ===== LEGEND / notes ===== -->
  <line x1="60" y1="1008" x2="1140" y2="1008" stroke="#b79b5e" stroke-width="1"/>
  <g transform="translate(60,1045)">
    <rect x="0" y="-16" width="28" height="18" fill="#d3ddec" stroke="#1f3a5f" stroke-width="2"/>
    <text x="38" y="-1" font-size="17" fill="#23314f">織田・徳川（連合軍）</text>
    <rect x="270" y="-16" width="28" height="18" fill="#e7d3d0" stroke="#7a1f1f" stroke-width="2"/>
    <text x="308" y="-1" font-size="17" fill="#5c2323">浅井・朝倉軍</text>
    <line x1="510" y1="-7" x2="552" y2="-7" stroke="#1f3a5f" stroke-width="4" marker-end="url(#arb)"/>
    <text x="562" y="-1" font-size="17" fill="#23314f">攻撃・機動</text>
  </g>
  <text x="1140" y="1044" text-anchor="end" font-size="13" fill="#8a7748">※布陣の東西・各隊位置は諸説あり。構図把握のための概念図</text>
</svg>
